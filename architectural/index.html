<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Architectural Work — Jose Photography TEST TEST</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="min-h-screen py-12 px-6 bg-zinc-950">

    <div class="max-w-5xl mx-auto">
        <a href="../" class="back-button inline-flex items-center gap-3 mb-10">
            ← <span>BACK TO COVER</span>
        </a>
        
        <div class="magazine-page p-10 md:p-16">
            <h1 class="text-5xl font-light text-center mb-12">Architectural Work</h1>
            
            <div id="gallery" class="space-y-16">
                <!-- Only the 3 real photos -->
            </div>
        </div>
    </div>

    <script>
        function openLightbox(src) {
            const modal = document.createElement('div');
            modal.className = 'fixed inset-0 bg-black/95 z-50 flex items-center justify-center p-4';
            modal.innerHTML = `
                <div class="magazine-page max-w-4xl p-8 max-h-[90vh] overflow-auto relative">
                    <img src="${src}" class="mx-auto shadow-2xl" style="max-height: 85vh;">
                    <button onclick="this.closest('.fixed').remove()" class="absolute -top-4 -right-4 text-5xl text-amber-900">×</button>
                </div>
            `;
            document.body.appendChild(modal);
        }

        const images = [
            "../BrickHouse.png",
            "../BrownBackyard.png",
            "../Staircase.png"
        ];

        const gallery = document.getElementById('gallery');
        images.forEach(src => {
            const div = document.createElement('div');
            div.className = "cursor-pointer";
            div.innerHTML = `<img src="${src}" class="w-full magazine-page p-8 shadow-2xl" onclick="openLightbox('${src}')">`;
            gallery.appendChild(div);
        });
    </script>
</body>
</html>
