<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Architectural Work — Jose Diaz</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="min-h-screen py-12 px-6 bg-zinc-950">

    <div class="max-w-5xl mx-auto">
        <a href="../" class="back-button inline-flex items-center gap-3 mb-10">
            ← <span>BACK TO COVER</span>
        </a>
        
        <div class="magazine-page p-10 md:p-16">
            <h1 class="text-5xl font-light text-center mb-12">Architectural Work</h1>
            
            <div id="gallery" class="space-y-16">
                <!-- Photos loaded by JS -->
            </div>
        </div>
    </div>

    <!-- Link to external JavaScript file -->
    <script src="../js/script.js"></script>
    
    <script>
        // Gallery images
        const images = [
            "../BrickHouse.png",
            "../BrownBackyard.png",
            "../Staircase.png"
        ];

        const gallery = document.getElementById('gallery');
        
        images.forEach(src => {
            const div = document.createElement('div');
            div.className = "cursor-pointer";
            div.innerHTML = `<img src="${src}" class="w-full magazine-page p-8 shadow-2xl gallery-img" onclick="openLightbox('${src}')">`;
            gallery.appendChild(div);
        });
    </script>
</body>

</html>
