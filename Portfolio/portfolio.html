<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio — Jose Diaz</title>
  <meta name="description" content="Architectural photography portfolio by Jose Diaz.">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

  <nav class="nav" aria-label="Main navigation">
    <a class="nav-logo" href="/">Jose Diaz</a>
    <button class="nav-toggle" aria-label="Toggle menu" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
    <ul class="nav-links" role="list">
      <li><a href="/">Home</a></li>
      <li><a href="/portfolio/" class="active">Portfolio</a></li>
      <li><a href="/about/">About</a></li>
    </ul>
  </nav>

  <header class="page-header fade-up">
    <p class="section-label">Work</p>
    <h1>Portfolio</h1>
    <p>Architectural photography — residential, commercial, and urban spaces throughout Arizona and beyond.</p>
  </header>

  <div class="gallery-controls">
    <button class="filter-btn active" data-filter="all">All</button>
    <button class="filter-btn" data-filter="residential">Residential</button>
    <button class="filter-btn" data-filter="commercial">Commercial</button>
    <button class="filter-btn" data-filter="detail">Detail</button>
    <span class="gallery-count">6 works</span>
  </div>

  <main>
    <div class="gallery" id="gallery" aria-label="Photo gallery">

      <div class="gallery-item" data-category="residential">
        <img src="../images/architectural/BrickHouse.png" alt="Brick house exterior" loading="lazy">
        <div class="gallery-item-overlay" aria-hidden="true"><div class="overlay-icon">+</div></div>
      </div>

      <div class="gallery-item" data-category="detail">
        <img src="../images/architectural/BrownBackyard.png" alt="Backyard architectural detail" loading="lazy">
        <div class="gallery-item-overlay" aria-hidden="true"><div class="overlay-icon">+</div></div>
      </div>

      <div class="gallery-item" data-category="detail">
        <img src="../images/architectural/Staircase.png" alt="Staircase interior" loading="lazy">
        <div class="gallery-item-overlay" aria-hidden="true"><div class="overlay-icon">+</div></div>
      </div>

      <div class="gallery-item" data-category="residential">
        <img src="../images/architectural/kitchen.png" alt="Kitchen interior" loading="lazy">
        <div class="gallery-item-overlay" aria-hidden="true"><div class="overlay-icon">+</div></div>
      </div>

      <!-- 🔴 RENAME these two to your actual new filenames -->
      <div class="gallery-item" data-category="detail">
        <img src="../images/architectural/CurbyWindows.jpg" alt="New detail photo" loading="lazy">
        <div class="gallery-item-overlay" aria-hidden="true"><div class="overlay-icon">+</div></div>
      </div>

      <div class="gallery-item" data-category="detail">
        <img src="../images/architectural/DetailedBuilding_TempeRandom.jpg" alt="New detail photo" loading="lazy">
        <div class="gallery-item-overlay" aria-hidden="true"><div class="overlay-icon">+</div></div>
      </div>

    </div>
  </main>

  <div class="lightbox" role="dialog" aria-modal="true" aria-label="Image viewer">
    <button class="lightbox-close" aria-label="Close">&times;</button>
    <button class="lightbox-prev" aria-label="Previous">&#8592;</button>
    <div class="lightbox-inner"><img class="lightbox-img" src="" alt="Enlarged photo"></div>
    <button class="lightbox-next" aria-label="Next">&#8594;</button>
    <p class="lightbox-caption"></p>
  </div>

  <footer class="site-footer">
    <span class="footer-logo">Jose Diaz</span>
    <ul class="footer-links" role="list">
      <li><a href="/portfolio/">Portfolio</a></li>
      <li><a href="/about/">About</a></li>
    </ul>
    <p class="footer-copy">&copy; <span id="year"></span> Jose Diaz</p>
  </footer>

  <script src="../js/main.js"></script>
  <script>document.getElementById('year').textContent = new Date().getFullYear();</script>
</body>
</html>
