<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jose | Photography</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        body {
            font-family: 'Georgia', serif;
            background: #1a1a1a url('https://via.placeholder.com/1920x1080/1f1f1f/555555?text=Subtle+Paper+Texture') repeat;
            background-size: cover;
        }
        .magazine-page {
            background: #f8f1e3;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            border: 1px solid #d4c8b5;
            color: #222;
        }
        .page-flip {
            transition: transform 0.8s cubic-bezier(0.7, 0, 0.3, 1);
        }
        .hero-bg {
            background: linear-gradient(rgba(0,0,0,0.75), rgba(0,0,0,0.85)), 
                        url('https://via.placeholder.com/1920x1080/111111/ffffff?text=Your+Best+Hero+Photo');
            background-size: cover;
            background-position: center;
        }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-200 min-h-screen">

    <!-- Hero / Cover -->
    <section class="hero-bg h-screen flex items-center justify-center text-center px-6 relative">
        <div class="magazine-page p-12 max-w-2xl mx-auto">
            <h1 class="text-7xl font-light tracking-tighter text-black mb-4">Jose</h1>
            <p class="text-3xl text-amber-900 font-light">Photography</p>
            <div class="mt-16">
                <a href="#albums" class="inline-block border-2 border-amber-900 hover:bg-amber-900 hover:text-white px-12 py-5 text-xl transition">Open the Book</a>
            </div>
        </div>
    </section>

    <!-- Albums Section (Page Flip Navigation) -->
    <section id="albums" class="py-24 px-6 max-w-7xl mx-auto">
        <h2 class="text-4xl font-light text-center mb-16 text-amber-100">Albums</h2>
        
        <div class="flex justify-center gap-8 mb-12">
            <button onclick="switchAlbum(0)" class="album-btn active px-8 py-3 border border-amber-800 hover:border-amber-400">Street</button>
            <button onclick="switchAlbum(1)" class="album-btn px-8 py-3 border border-amber-800 hover:border-amber-400">Portraits</button>
            <button onclick="switchAlbum(2)" class="album-btn px-8 py-3 border border-amber-800 hover:border-amber-400">Landscapes</button>
        </div>

        <!-- Album Pages -->
        <div id="album-container" class="magazine-page p-8 max-w-5xl mx-auto">
            <div id="album-content">
                <!-- Content changes via JS -->
            </div>
        </div>
    </section>

    <script>
        const albums = [
            {
                title: "Street",
                images: [
                    "https://via.placeholder.com/800x1000/ddd/333?text=Street+1",
                    "https://via.placeholder.com/800x1000/ddd/333?text=Street+2"
                ]
            },
            {
                title: "Portraits",
                images: [
                    "https://via.placeholder.com/800x1000/ddd/333?text=Portrait+1",
                    "https://via.placeholder.com/800x1000/ddd/333?text=Portrait+2"
                ]
            },
            {
                title: "Landscapes",
                images: [
                    "https://via.placeholder.com/800x1000/ddd/333?text=Landscape+1"
                ]
            }
        ];

        function switchAlbum(index) {
            const container = document.getElementById('album-content');
            let html = `<h3 class="text-3xl font-light mb-8 text-center">${albums[index].title}</h3>`;
            
            albums[index].images.forEach((src, i) => {
                html += `
                    <div class="mb-12 cursor-pointer" onclick="openLightbox('${src}')">
                        <img src="${src}" class="w-full magazine-page p-4 shadow-2xl" alt="${albums[index].title} ${i+1}">
                    </div>
                `;
            });
            
            container.innerHTML = html;
            
            // Simple "page flip" visual
            const page = document.getElementById('album-container');
            page.style.transform = 'rotateY(5deg)';
            setTimeout(() => page.style.transform = 'rotateY(0deg)', 400);
        }

        // Simple Lightbox (magazine page style)
        function openLightbox(src) {
            const modal = document.createElement('div');
            modal.className = 'fixed inset-0 bg-black/95 flex items-center justify-center z-50 p-8';
            modal.innerHTML = `
                <div class="magazine-page max-w-4xl p-8 max-h-[90vh] overflow-auto">
                    <img src="${src}" class="max-h-[80vh] mx-auto shadow-2xl" alt="Photo">
                    <button onclick="this.closest('.fixed').remove()" class="absolute top-8 right-8 text-4xl text-amber-900 hover:text-black">&times;</button>
                </div>
            `;
            document.body.appendChild(modal);
        }

        // Initialize first album
        window.onload = () => switchAlbum(0);
    </script>
</body>
</html>
