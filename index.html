<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jose | Architectural Photography</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Georgia', serif;
            background: #111 url('https://via.placeholder.com/1920x1200/1a1a1a/444?text=Dark+Paper+Texture') repeat;
        }
        .magazine-page {
            background: #f8f1e3;
            box-shadow: 0 15px 40px rgba(0,0,0,0.7);
            border: 1px solid #d4c8b5;
            color: #1a1a1a;
        }
        .hero-bg {
            background: linear-gradient(rgba(0,0,0,0.75), rgba(0,0,0,0.85)), 
                        url('kitchen.png') center/cover no-repeat;
        }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen">

    <!-- Cover -->
    <section class="hero-bg min-h-screen flex items-center justify-center text-center px-6 relative">
        
        <div class="magazine-page p-12 md:p-16 max-w-2xl mx-auto">
            <h1 class="text-7xl font-light tracking-tighter text-black mb-4">Jose</h1>
            <p class="text-4xl text-amber-900 font-light mb-8">Architectural Photography</p>
            
            <!-- About Me -->
            <div class="mb-12 max-w-md mx-auto">
                <p class="text-lg leading-relaxed text-amber-950">
                    I'm Jose, a photographer with a passion for capturing the beauty of architecture and spaces. 
                    I specialize in highlighting clean lines, natural light, and the unique character of buildings.
                </p>
            </div>

            <a href="architectural.html" 
               class="inline-block border-2 border-amber-900 hover:bg-amber-900 hover:text-white px-16 py-7 text-2xl tracking-wider transition">
               ENTER THE PORTFOLIO
            </a>
        </div>
    </section>

</body>
</html>
